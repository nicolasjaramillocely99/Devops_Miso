version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blacklist_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blacklist_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacklist_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: blacklist_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  pgdata:
